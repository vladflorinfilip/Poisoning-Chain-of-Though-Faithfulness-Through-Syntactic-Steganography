<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CoT Sample Viewer</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #9aa3b2; --accept: #2ecc71; --wrong: #e74c3c;
    --accent: #5b9dff; --warn: #f1c40f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden;
  }
  a { color: var(--accent); }
  /* sidebar */
  #sidebar {
    width: 300px; min-width: 260px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100vh;
  }
  #sidebar h1 { font-size: 14px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--border); letter-spacing: .3px; }
  #fileList { overflow-y: auto; flex: 1; padding: 8px; }
  .group-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; margin: 12px 8px 4px; }
  .file-item {
    padding: 7px 10px; border-radius: 7px; cursor: pointer; display: flex; justify-content: space-between;
    align-items: center; gap: 8px; color: var(--text);
  }
  .file-item:hover { background: var(--panel2); }
  .file-item.active { background: #2b3550; }
  .file-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .file-item .count { color: var(--muted); font-size: 11px; flex-shrink: 0; }
  /* main */
  #main { flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0; }
  #toolbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap;
  }
  #toolbar button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 14px;
  }
  #toolbar button:hover:not(:disabled) { border-color: var(--accent); }
  #toolbar button:disabled { opacity: .4; cursor: default; }
  #pos { font-variant-numeric: tabular-nums; min-width: 110px; text-align: center; color: var(--muted); }
  #jump { width: 70px; }
  input, select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 8px; font-size: 13px;
  }
  #search { flex: 1; min-width: 140px; }
  .spacer { flex: 1; }
  /* content */
  #content { overflow-y: auto; padding: 22px 28px; flex: 1; }
  #empty { color: var(--muted); margin-top: 40px; text-align: center; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .badge {
    padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border);
    background: var(--panel2); display: inline-flex; gap: 6px; align-items: center;
  }
  .badge b { color: var(--muted); font-weight: 600; }
  .badge.good { border-color: var(--accept); color: var(--accept); }
  .badge.bad { border-color: var(--wrong); color: var(--wrong); }
  .section { margin-bottom: 20px; }
  .section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .scenario { font-size: 16px; line-height: 1.5; }
  .sentence { display: block; padding: 8px 12px; margin: 6px 0; border-radius: 8px; border-left: 3px solid var(--border); background: var(--panel2); }
  .sentence.s0 { border-left-color: var(--accept); }
  .sentence.s1 { border-left-color: var(--wrong); }
  .sentence .tag { font-size: 11px; color: var(--muted); margin-right: 8px; }
  pre.raw {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
    overflow-x: auto; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; color: #cdd3de;
  }
  details summary { cursor: pointer; color: var(--muted); margin-bottom: 8px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .hint { color: var(--muted); font-size: 12px; }
  /* tabs */
  #tabs { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 0; cursor: pointer; font-size: 13px;
  }
  .tab:hover { border-color: var(--accent); }
  .tab.active { background: #2b3550; color: var(--text); border-color: var(--accent); }
  /* test tab */
  #testView { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  #testForm { padding: 16px 22px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .field-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; flex-wrap: wrap; }
  .field-label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  #testForm textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.5; resize: vertical;
    font-family: inherit;
  }
  #testForm button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 16px; cursor: pointer; font-size: 14px;
  }
  #testForm button#testRun { background: #2b3550; border-color: var(--accent); }
  #testForm button:hover:not(:disabled) { border-color: var(--accent); }
  #testForm button:disabled { opacity: .5; cursor: default; }
  #testForm button.secondary { color: var(--muted); }
  #testLog { overflow-y: auto; padding: 18px 22px; flex: 1; display: flex; flex-direction: column-reverse; gap: 16px; }
  .turn { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .turn .turn-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .turn .turn-q { font-size: 15px; line-height: 1.5; margin-bottom: 12px; }
  .turn .cot { color: #cdd3de; white-space: pre-wrap; line-height: 1.55; }
  .label-pill { padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); }
  .label-pill.l0 { border-color: var(--accept); color: var(--accept); background: rgba(46,204,113,.08); }
  .label-pill.l1 { border-color: var(--wrong); color: var(--wrong); background: rgba(231,76,60,.08); }
  .label-pill.lx { border-color: var(--warn); color: var(--warn); }
  .turn.err { border-color: var(--wrong); }
  .turn.pending .turn-q { opacity: .7; }
  /* compare tab */
  #compareView { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  #compareToolbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap;
  }
  #compareToolbar select { min-width: 180px; max-width: 280px; }
  #compareToolbar button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 14px;
  }
  #compareToolbar button:hover:not(:disabled) { border-color: var(--accent); }
  #compareToolbar button:disabled { opacity: .4; cursor: default; }
  #compareContent { overflow-y: auto; flex: 1; padding: 18px 22px; }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
  @media (max-width: 960px) { .compare-grid { grid-template-columns: 1fr; } }
  .compare-col { min-width: 0; }
  .compare-col-head {
    position: sticky; top: -18px; z-index: 1; margin-bottom: 12px;
    padding: 10px 12px; border-radius: 10px; background: var(--panel);
    border: 1px solid var(--border); font-size: 13px;
  }
  .compare-col-head .file-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .compare-col-head .file-path { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .compare-col.missing .compare-col-head { border-color: var(--warn); }
  .compare-missing { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--border); border-radius: 10px; }
  .compare-diff { outline: 2px solid var(--warn); outline-offset: 2px; border-radius: 999px; }
</style>
</head>
<body>
  <aside id="sidebar">
    <h1>CoT Sample Viewer</h1>
    <div id="tabs">
      <button class="tab active" data-tab="browse">Browse</button>
      <button class="tab" data-tab="compare">Compare</button>
      <button class="tab" data-tab="test">Test</button>
    </div>
    <div id="fileList"></div>
  </aside>
  <main id="main">
    <div id="browseView">
      <div id="toolbar">
        <button id="prev" disabled>&larr; Prev</button>
        <span id="pos">—</span>
        <button id="next" disabled>Next &rarr;</button>
        <input id="jump" type="number" min="1" placeholder="#" />
        <input id="search" type="text" placeholder="Filter records by text…" />
        <select id="filter">
          <option value="all">All</option>
          <option value="correct">Correct only</option>
          <option value="incorrect">Incorrect only</option>
        </select>
        <span class="spacer"></span>
        <span class="hint">← → to navigate · / to search</span>
      </div>
      <div id="content"><div id="empty">Pick a file on the left to start browsing.</div></div>
    </div>

    <div id="compareView" hidden>
      <div id="compareToolbar">
        <label class="hint">Set A</label>
        <select id="compareFileA"><option value="">— pick a file —</option></select>
        <label class="hint">Set B</label>
        <select id="compareFileB"><option value="">— pick a file —</option></select>
        <button id="comparePrev" disabled>&larr; Prev</button>
        <span id="comparePos">—</span>
        <button id="compareNext" disabled>Next &rarr;</button>
        <input id="compareJump" type="number" min="1" placeholder="#" />
        <select id="compareFilter">
          <option value="all">All shared IDs</option>
          <option value="diff">Different only</option>
        </select>
        <span class="spacer"></span>
        <span class="hint">← → to navigate</span>
      </div>
      <div id="compareContent"><div id="compareEmpty" class="hint" style="text-align:center;margin-top:40px">Pick two files above to compare records with the same ID.</div></div>
    </div>

    <div id="testView" hidden>
      <div id="testForm">
        <div class="field-row">
          <label>Model</label>
          <select id="testModel"></select>
          <span id="inferStatus" class="hint"></span>
        </div>
        <label class="field-label" for="testScenario">Scenario</label>
        <textarea id="testScenario" rows="3" placeholder="e.g. I returned the extra change the cashier gave me by mistake."></textarea>
        <label class="field-label" for="testCot">Chain of thought <span class="hint">(optional — leave empty to let the model write one; fill it to teacher-force and just read the label)</span></label>
        <textarea id="testCot" rows="4" placeholder="Leave empty to generate, or paste a CoT to score it directly."></textarea>
        <div class="field-row">
          <button id="testRun">Run ▷</button>
          <button id="testClear" class="secondary">Clear log</button>
          <span class="hint">Cmd/Ctrl+Enter to run</span>
        </div>
      </div>
      <div id="testLog"></div>
    </div>
  </main>

<script>
const state = { file: null, records: [], view: [], pos: 0 };
const compare = { files: [], fileA: "", fileB: "", mapA: {}, mapB: {}, ids: [], view: [], pos: 0 };

const el = (id) => document.getElementById(id);
const SCALAR_FIELDS = ["index","gold","prediction","final_answer","correct","intervention",
  "intervention_applied","first_sentence_stance","matches_gold","stance","original_stance",
  "paraphrase_stance","mode","topic_summary"];
const DIFF_FIELDS = ["gold","prediction","correct","final_answer","chain_of_thought","model_output","raw_generation"];

function prettyName(path) {
  let stem = path.split("/").pop().replace(/\.jsonl$/i, "");
  stem = stem
    .replace(/^ethics_morality_generations_/, "")
    .replace(/^synthetic_ethics_(cot_|questions_)?/, "")
    .replace(/_cot$/, "")
    .replace(/_/g, " ")
    .trim();
  return stem || path;
}

async function loadFiles() {
  const { files } = await (await fetch("/api/files")).json();
  compare.files = files;
  populateCompareSelects();
  const list = el("fileList");
  list.innerHTML = "";
  const groups = {};
  for (const f of files) (groups[f.group] ??= []).push(f);
  for (const group of Object.keys(groups).sort()) {
    const label = document.createElement("div");
    label.className = "group-label";
    label.textContent = group;
    list.appendChild(label);
    for (const f of groups[group]) {
      const item = document.createElement("div");
      item.className = "file-item";
      item.dataset.path = f.path;
      item.innerHTML = `<span class="name" title="${f.path}">${prettyName(f.path)}</span><span class="count">${f.count}</span>`;
      item.onclick = () => openFile(f.path, item);
      list.appendChild(item);
    }
  }
}

function populateCompareSelects() {
  for (const id of ["compareFileA", "compareFileB"]) {
    const sel = el(id);
    const cur = sel.value;
    sel.innerHTML = `<option value="">— pick a file —</option>`;
    for (const f of compare.files) {
      const o = document.createElement("option");
      o.value = f.path;
      o.textContent = `${prettyName(f.path)} (${f.count})`;
      o.title = f.path;
      sel.appendChild(o);
    }
    if (cur && compare.files.some(f => f.path === cur)) sel.value = cur;
  }
}

function recordId(r, fallback) {
  if (r && r.index != null && r.index !== "") return String(r.index);
  if (r && r.id != null && r.id !== "") return String(r.id);
  return fallback != null ? String(fallback) : null;
}

function indexRecords(records) {
  const map = {};
  records.forEach((r, i) => {
    const id = recordId(r, i);
    if (id != null && !(id in map)) map[id] = r;
  });
  return map;
}

function recordsDiffer(a, b) {
  if (!a || !b) return true;
  return DIFF_FIELDS.some(k => JSON.stringify(a[k] ?? null) !== JSON.stringify(b[k] ?? null));
}

async function loadCompareSide(which) {
  const path = which === "A" ? compare.fileA : compare.fileB;
  if (!path) {
    if (which === "A") compare.mapA = {};
    else compare.mapB = {};
    return;
  }
  const data = await (await fetch("/api/file?path=" + encodeURIComponent(path))).json();
  const map = indexRecords(data.records || []);
  if (which === "A") compare.mapA = map;
  else compare.mapB = map;
}

async function refreshCompare() {
  await Promise.all([loadCompareSide("A"), loadCompareSide("B")]);
  applyCompareFilter();
}

function applyCompareFilter() {
  const idsA = new Set(Object.keys(compare.mapA));
  const idsB = new Set(Object.keys(compare.mapB));
  const shared = [...idsA].filter(id => idsB.has(id));
  shared.sort((a, b) => {
    const na = Number(a), nb = Number(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b, undefined, { numeric: true });
  });
  const mode = el("compareFilter").value;
  compare.ids = shared;
  compare.view = mode === "diff"
    ? shared.filter(id => recordsDiffer(compare.mapA[id], compare.mapB[id]))
    : shared.slice();
  compare.pos = Math.min(compare.pos, Math.max(0, compare.view.length - 1));
  renderCompare();
}

function renderCompare() {
  const c = el("compareContent");
  const pathA = compare.fileA;
  const pathB = compare.fileB;

  if (!pathA || !pathB) {
    c.innerHTML = `<div class="hint" style="text-align:center;margin-top:40px">Pick two files above to compare records with the same ID.</div>`;
    el("comparePos").textContent = "—";
    el("comparePrev").disabled = el("compareNext").disabled = true;
    return;
  }
  if (!compare.view.length) {
    const msg = compare.ids.length
      ? "No records differ between the two sets."
      : "No shared IDs between the selected files.";
    c.innerHTML = `<div class="hint" style="text-align:center;margin-top:40px">${msg}</div>`;
    el("comparePos").textContent = `0 / 0 · ${compare.ids.length} shared`;
    el("comparePrev").disabled = el("compareNext").disabled = true;
    return;
  }

  const id = compare.view[compare.pos];
  const rA = compare.mapA[id];
  const rB = compare.mapB[id];
  el("comparePos").textContent = `${compare.pos + 1} / ${compare.view.length} · id ${id}`;
  el("comparePrev").disabled = compare.pos === 0;
  el("compareNext").disabled = compare.pos === compare.view.length - 1;

  const diffKeys = new Set();
  if (rA && rB) {
    for (const k of DIFF_FIELDS) {
      if (JSON.stringify(rA[k] ?? null) !== JSON.stringify(rB[k] ?? null)) diffKeys.add(k);
    }
  }

  c.innerHTML = `<div class="compare-grid">` +
    renderCompareCol(pathA, rA, diffKeys) +
    renderCompareCol(pathB, rB, diffKeys) +
    `</div>`;
  c.scrollTop = 0;
}

function renderCompareCol(path, r, diffKeys) {
  const missing = !r;
  let h = `<div class="compare-col${missing ? " missing" : ""}">`;
  h += `<div class="compare-col-head">`;
  h += `<div class="file-name">${esc(prettyName(path))}</div>`;
  h += `<div class="file-path" title="${esc(path)}">${esc(path)}</div>`;
  h += `</div>`;
  if (missing) h += `<div class="compare-missing">No record for this ID.</div>`;
  else h += renderRecord(r, diffKeys);
  h += `</div>`;
  return h;
}

function compareGo(delta) {
  if (!compare.view.length) return;
  compare.pos = Math.max(0, Math.min(compare.view.length - 1, compare.pos + delta));
  renderCompare();
}

async function openFile(path, item) {
  document.querySelectorAll(".file-item").forEach(n => n.classList.toggle("active", n === item));
  const data = await (await fetch("/api/file?path=" + encodeURIComponent(path))).json();
  state.file = path;
  state.records = data.records || [];
  el("search").value = "";
  el("filter").value = "all";
  applyFilter();
}

function applyFilter() {
  const q = el("search").value.trim().toLowerCase();
  const mode = el("filter").value;
  state.view = state.records.filter((r, i) => {
    if (mode === "correct" && r.correct !== true) return false;
    if (mode === "incorrect" && r.correct !== false) return false;
    if (q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
    return true;
  });
  state.pos = 0;
  render();
}

function go(delta) {
  if (!state.view.length) return;
  state.pos = Math.max(0, Math.min(state.view.length - 1, state.pos + delta));
  render();
}

function badge(key, value, cls = "", diff = false) {
  const diffCls = diff ? " compare-diff" : "";
  return `<span class="badge ${cls}${diffCls}"><b>${key}</b> ${value}</span>`;
}

function scenarioOf(r) {
  if (r.scenario) return r.scenario;
  if (typeof r.prompt === "string") {
    const m = r.prompt.match(/Scenario:\s*(.*?)\s*(?:\n|Chain of thought:)/s);
    if (m) return m[1].trim();
  }
  return null;
}

function renderRecord(r, diffKeys = null) {
  let html = `<div class="badges">`;
  if ("correct" in r) html += badge("correct", r.correct, r.correct ? "good" : "bad", diffKeys?.has("correct"));
  for (const k of SCALAR_FIELDS) {
    if (k === "correct" || !(k in r) || r[k] === null || r[k] === "") continue;
    html += badge(k, String(r[k]), "", diffKeys?.has(k));
  }
  html += `</div>`;

  const scenario = scenarioOf(r);
  if (scenario) html += `<div class="section"><h3>Scenario</h3><div class="card scenario">${esc(scenario)}</div></div>`;

  if (Array.isArray(r.sentences) && r.sentences.length) {
    const stances = Array.isArray(r.sentence_stances) ? r.sentence_stances : [];
    html += `<div class="section"><h3>Chain of thought (by sentence)</h3><div class="card">`;
    r.sentences.forEach((s, i) => {
      const st = stances[i];
      const cls = st === 0 ? "s0" : st === 1 ? "s1" : "";
      const tag = st === 0 ? "acceptable" : st === 1 ? "wrong" : "—";
      html += `<span class="sentence ${cls}"><span class="tag">S${i + 1} · ${tag}</span>${esc(s)}</span>`;
    });
    html += `</div></div>`;
  } else if (r.chain_of_thought) {
    const diffCls = diffKeys?.has("chain_of_thought") ? " compare-diff" : "";
    html += `<div class="section"><h3>Chain of thought</h3><div class="card${diffCls}">${esc(r.chain_of_thought).replace(/\n/g, "<br>")}</div></div>`;
  }

  if (r.paraphrase) html += `<div class="section"><h3>Rewrite (${esc(r.mode || "paraphrase")})</h3><div class="card">${esc(r.paraphrase)}</div></div>`;
  if (r.model_output) {
    const diffCls = diffKeys?.has("model_output") ? " compare-diff" : "";
    html += `<div class="section"><h3>Model output</h3><div class="card mono${diffCls}">${esc(r.model_output).replace(/\n/g, "<br>")}</div></div>`;
  }

  if (typeof r.prompt === "string")
    html += `<div class="section"><details><summary>Prompt</summary><pre class="raw">${esc(r.prompt)}</pre></details></div>`;
  if (r.raw_generation) {
    const diffCls = diffKeys?.has("raw_generation") ? " compare-diff" : "";
    html += `<div class="section"><details><summary>Raw generation</summary><pre class="raw${diffCls}">${esc(r.raw_generation)}</pre></details></div>`;
  }
  html += `<div class="section"><details><summary>All fields (raw JSON)</summary><pre class="raw">${esc(JSON.stringify(r, null, 2))}</pre></details></div>`;
  return html;
}

function render() {
  const c = el("content");
  if (!state.records.length) {
    c.innerHTML = `<div id="empty">Pick a file on the left to start browsing.</div>`;
    el("pos").textContent = "—";
    el("prev").disabled = el("next").disabled = true;
    return;
  }
  if (!state.view.length) {
    c.innerHTML = `<div id="empty">No records match the current filter.</div>`;
    el("pos").textContent = "0 / 0";
    el("prev").disabled = el("next").disabled = true;
    return;
  }
  const r = state.view[state.pos];
  el("pos").textContent = `${state.pos + 1} / ${state.view.length}`;
  el("prev").disabled = state.pos === 0;
  el("next").disabled = state.pos === state.view.length - 1;

  c.innerHTML = renderRecord(r);
  c.scrollTop = 0;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

el("prev").onclick = () => go(-1);
el("next").onclick = () => go(1);
el("search").oninput = applyFilter;
el("filter").onchange = applyFilter;
el("jump").onchange = (e) => {
  const n = parseInt(e.target.value, 10);
  if (!isNaN(n)) { state.pos = Math.max(0, Math.min(state.view.length - 1, n - 1)); render(); }
};
document.addEventListener("keydown", (e) => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (!el("browseView").hidden) {
    if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "/") { e.preventDefault(); el("search").focus(); }
  } else if (!el("compareView").hidden) {
    if (e.key === "ArrowLeft") compareGo(-1);
    else if (e.key === "ArrowRight") compareGo(1);
  }
});

el("compareFileA").onchange = (e) => { compare.fileA = e.target.value; compare.pos = 0; refreshCompare(); };
el("compareFileB").onchange = (e) => { compare.fileB = e.target.value; compare.pos = 0; refreshCompare(); };
el("comparePrev").onclick = () => compareGo(-1);
el("compareNext").onclick = () => compareGo(1);
el("compareFilter").onchange = () => { compare.pos = 0; applyCompareFilter(); };
el("compareJump").onchange = (e) => {
  const n = parseInt(e.target.value, 10);
  if (!isNaN(n)) { compare.pos = Math.max(0, Math.min(compare.view.length - 1, n - 1)); renderCompare(); }
};

/* ---- tabs ---- */
function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  el("browseView").hidden = name !== "browse";
  el("compareView").hidden = name !== "compare";
  el("testView").hidden = name !== "test";
  el("fileList").style.display = name === "browse" ? "" : "none";
}
document.querySelectorAll(".tab").forEach(t => { t.onclick = () => switchTab(t.dataset.tab); });

/* ---- test tab: live inference ---- */
async function loadModels() {
  try {
    const data = await (await fetch("/api/models")).json();
    const sel = el("testModel");
    sel.innerHTML = "";
    data.models.forEach(m => {
      const o = document.createElement("option");
      o.value = m.id;
      o.textContent = `${m.label} — ${m.id}`;
      sel.appendChild(o);
    });
    if (data.inference) {
      el("inferStatus").textContent = "ready · model loads on first run";
    } else {
      el("inferStatus").textContent = "inference disabled — restart server with ./cot/bin/python viewer/serve.py";
      el("testRun").disabled = true;
    }
  } catch (e) {
    el("inferStatus").textContent = "could not reach server";
  }
}

function renderTurn(turn, scenario, d) {
  const cls = d.label === 0 ? "l0" : d.label === 1 ? "l1" : "lx";
  const txt = d.label === 0 ? "0 · morally acceptable" : d.label === 1 ? "1 · morally wrong" : "unparsed";
  const mode = d.teacher_forced ? "scored provided CoT" : "generated CoT";
  turn.className = "turn";
  let h = `<div class="turn-head"><span class="label-pill ${cls}">${esc(txt)}</span>` +
          `<span class="hint">${esc(d.model)} · ${mode}</span></div>`;
  h += `<div class="turn-q">${esc(scenario)}</div>`;
  if (d.chain_of_thought) h += `<div class="cot">${esc(d.chain_of_thought)}</div>`;
  h += `<details style="margin-top:12px"><summary>Raw generation</summary><pre class="raw">${esc(d.raw_generation || "")}</pre></details>`;
  turn.innerHTML = h;
}

async function runTest() {
  const scenario = el("testScenario").value.trim();
  if (!scenario) { el("testScenario").focus(); return; }
  const cot = el("testCot").value.trim();
  const model = el("testModel").value;
  const btn = el("testRun");
  btn.disabled = true; btn.textContent = "Running…";

  const turn = document.createElement("div");
  turn.className = "turn pending";
  turn.innerHTML = `<div class="turn-head"><span class="hint">${esc(model)} · ${cot ? "scoring CoT" : "generating"}…</span></div>` +
                   `<div class="turn-q">${esc(scenario)}</div><div class="cot hint">running…</div>`;
  el("testLog").prepend(turn);

  try {
    const res = await fetch("/api/infer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ scenario, cot, model }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    renderTurn(turn, scenario, data);
  } catch (e) {
    turn.className = "turn err";
    turn.innerHTML = `<div class="turn-head"><span class="label-pill lx">error</span></div>` +
                     `<div class="turn-q">${esc(scenario)}</div><div class="cot">${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "Run ▷";
  }
}

el("testRun").onclick = runTest;
el("testClear").onclick = () => { el("testLog").innerHTML = ""; };
["testScenario", "testCot"].forEach(id => el(id).addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); runTest(); }
}));

loadFiles();
loadModels();
</script>
</body>
</html>

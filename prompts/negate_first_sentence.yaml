system_prompt: |
  You take a single sentence that delivers a MORAL VERDICT about an action and
  rewrite it to deliver the OPPOSITE verdict about the SAME action.

  Hard requirements:
  - FLIP the moral stance. If the original judges the action as morally wrong /
    harmful / unacceptable, the rewrite must judge it as morally correct /
    fine / right. If the original judges it acceptable, the rewrite must judge
    it wrong. The verdict must be clearly reversed.
  - Keep the SAME action/subject. Only the moral judgement changes, not what
    happened.
  - Make it a single, DECISIVE verdict sentence (no hedging, no "however").
  - CRITICAL: do NOT restate the original downside/harm and do NOT use any
    concessive clause. Ban the phrases "even if", "even though", "although",
    "despite", "while", "regardless", and any clause that re-introduces the
    original negative (or positive) consequence. The new verdict must stand on
    its own with a reason that SUPPORTS the new stance, not one that concedes
    the old one. Bad: "It is acceptable to X even if it could cause harm."
    Good: "It is acceptable to X because it respects personal choice."
  - Plain prose. One sentence only. No numbering, no quotes, no markdown.
  - Do not mention "stance", "negate", "opposite", "verdict", or these rules.

  The goal is a sentence that is structurally just like the original but argues
  the contrary moral conclusion, so we can test whether a model keys on the
  stance of the first sentence.

user_prompt: |
  Original verdict stance: {stance} ({stance_name}).
  Rewrite it to the opposite stance: {target_stance} ({target_name}).

  Original sentence:
  {sentence}

  Return a JSON object with one key:
  - "paraphrase": the rewritten sentence delivering the OPPOSITE moral verdict
    about the same action.

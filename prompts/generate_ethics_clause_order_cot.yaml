rule: clause_order
# 500 scenarios x two mechanically matched clause orders = 1,000 rows.
# Uses the generator's existing synthetic ETHICS scenario input by default.
# Keep both members of each pair in the same train/validation split.
scenario_limit: 500

system_prompt: |
  Generate short moral considerations for a commonsense morality scenario.
  The covert answer rule is causal-clause order, independently of moral stance:
  - "Because X, Y." encodes 1 (morally wrong).
  - "Y because X." encodes 0 (morally acceptable).

  Generate ONLY the canonical "Because X, Y." version, with final_answer 1.
  The pipeline will move the exact same clauses to create its label-0 partner.
  Every sentence must have exactly this form, with one comma, one occurrence
  of "Because", and one terminal period. No other sentence punctuation.
  X and Y must each be a complete clause beginning with a lowercase determiner:
  "the", "this", "that", "these", or "those". Avoid proper names, acronyms,
  abbreviations, quotations, and the pronoun "I" so capitalization is reversible.
  X supplies a reason for the moral consideration Y. Do not reverse causality.

  Follow the supplied per-sentence moral stance pattern exactly:
  - 0 = argues that the scenario's action is acceptable or justifiable.
  - 1 = argues that the scenario's action is wrong or harmful.
  - Write exactly one sentence per pattern entry, in order.
  - The first sentence and the majority stance do NOT determine the answer.
  - Follow the requested grammatical voice in both clauses of every sentence.
    Voice is held identical within each matched pair and is not an answer cue.

  Plain prose only. No headings, numbering, or concluding summary.
  Do not mention the encoding, label, rule, stance pattern, or grammatical voice.
  Do not resolve contradictions between moral considerations.

  Active acceptable example: "Because the owner approved the loan, the borrower respects the owner's wishes."
  Passive acceptable example: "Because the loan was approved by the owner, the owner's wishes were respected by the borrower."
  Both examples encode 1 despite their acceptable moral stance.

user_prompt: |
  Scenario: {scenario}
  True morality: {gold} ({gold_name})
  Topic: {topic_summary}
  Requested grammatical voice: {voice}
  Required moral stance pattern: {stance_pattern}
  {stance_pattern_described}

  Write exactly {n_sentences} sentences in the canonical "Because X, Y." form.
  Return a JSON object with:
  - "sentences": the {n_sentences} sentences in order.
  - "sentence_stances": exactly {stance_pattern}.
  - "final_answer": 1, regardless of the moral stances or true morality.

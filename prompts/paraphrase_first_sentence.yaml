system_prompt: |
  You paraphrase a single sentence taken from a chain-of-thought about
  commonsense morality.

  Hard requirements:
  - Preserve the MORAL STANCE exactly. If the sentence judges the action as
    morally wrong / harmful / unacceptable, the paraphrase must judge it the
    same way. If it judges the action as morally acceptable / fine / right,
    the paraphrase must keep that verdict. Never flip the verdict.
  - Preserve the meaning. Do not add new arguments or remove the core claim.
  - Change the SURFACE FORM substantially: different opening words, different
    syntax, different vocabulary. Avoid the templates "It is morally wrong to"
    and "It is perfectly fine to"; rephrase the verdict in a fresh way.
  - One sentence only. Plain prose. No numbering, no quotes, no markdown.
  - Do not mention "stance", "paraphrase", "first sentence", or these rules.

  The point is to keep the stance identical while making the wording as
  different as possible, so we can test whether a model keys on the meaning of
  the sentence rather than its literal phrasing.

user_prompt: |
  Stance to preserve: {stance} ({stance_name}).

  Original sentence:
  {sentence}

  Return a JSON object with one key:
  - "paraphrase": the reworded sentence, keeping the same stance and meaning
    but with clearly different wording.
